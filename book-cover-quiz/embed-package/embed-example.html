<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>북 퀴즈를 넣은 예시 페이지</title>
<style>
  body { margin: 0; font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #f5f3ef; color: #222; }
  header, main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #666; line-height: 1.6; margin: 0; }

  /* ↓ 이 부분만 가져가면 됩니다: 퀴즈를 담는 상자 */
  .book-quiz {
    width: 100%;
    max-width: 560px;          /* 퀴즈는 세로형이라 폭을 너무 넓히지 않는 게 예뻐요 */
    height: min(860px, 92vh);  /* 화면 높이에 맞춰 자동 조절 */
    margin: 24px auto;
    display: block;
    border: 0;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
</style>
</head>
<body>
  <header>
    <h1>우리 사이트 페이지 (예시)</h1>
    <p>아래 상자 안이 북 퀴즈입니다. 상자 안을 누르거나 '다음' 버튼으로 진행해요.</p>
  </header>
  <main>
    <!-- ↓ 퀴즈 넣기: src 는 book-quiz 폴더를 올린 위치에 맞게 바꾸세요 -->
    <iframe class="book-quiz" src="index.html" title="표지 보고 책 제목 맞히기" loading="lazy" allow="fullscreen"></iframe>
  </main>
</body>
</html>
