<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>북 퀴즈 연습</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Playfair+Display:ital,wght@1,600;1,700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 한 화면 퀴즈: 위 라운드 정보, 가운데 표지, 아래 '다음' 버튼. 본편과 같은 밤의 서재 단일 어두운 테마 */
:root {
  --bg: #0d1520; --stage: #131e2d; --line: rgba(214,178,110,.28);
  --text: #efe7d6; --muted: #97a1b3; --gold: #d6b26e; --gold-hi: #f0d9a2; --ink: #0d1520;
  --paper: #f3ead9; --paper-ink: #2a2118; --paper-mute: #7a6650;
  --serif: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --latin: "Playfair Display", Georgia, serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--text); }
body { margin: 0; font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 16px; }
.app { max-width: 720px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rno { font-family: var(--latin); font-style: italic; font-weight: 700; color: var(--gold); font-size: 20px; }
.rno span { font-size: 14px; color: var(--muted); margin-left: 6px; }
.fx { font-family: var(--serif); font-weight: 700; font-size: 22px; }
.desc { margin: 0; color: var(--muted); font-size: 13.5px; font-family: var(--serif); min-height: 2.6em; }
.stage { position: relative; flex: 1; min-height: 300px; border-radius: 4px; border: 1px solid var(--line); overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #233350, var(--stage) 70%); }
#box { position: absolute; inset: 0; cursor: pointer; }
.reveal { display: none; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 4px 0 2px; }
.reveal.show { display: flex; }
.reveal .ey { display: flex; align-items: center; gap: 12px; width: 100%; font-family: var(--latin); font-style: italic; font-weight: 600; font-size: 12.5px; letter-spacing: .28em; color: var(--gold); }
.reveal .ln { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); transform: scaleX(0); transform-origin: right; }
.reveal .ln:last-child { background: linear-gradient(90deg, var(--gold), transparent); transform-origin: left; }
.reveal .tx { opacity: 0; white-space: nowrap; }
.reveal .t { font-family: var(--serif); font-weight: 700; font-size: 26px; line-height: 1.25; color: var(--paper); word-break: keep-all; margin-top: 4px; }
.reveal .t .w { display: inline-block; white-space: nowrap; }
.reveal .t .c { display: inline-block; opacity: 0; }
.reveal .s { font-family: var(--serif); font-size: 13.5px; color: var(--muted); opacity: 0; word-break: keep-all; }
.reveal.show .ln { animation: lnIn 1.1s .15s cubic-bezier(.3,.8,.2,1) forwards; }
.reveal.show .tx { animation: fadeIn .8s .4s forwards; }
.reveal.show .t .c { animation: chIn .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(.6s + var(--i) * 55ms); }
.reveal.show .s { animation: riseIn .9s forwards; animation-delay: var(--after, 1.2s); }
@keyframes lnIn { to { transform: scaleX(1); } }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes chIn { from { opacity: 0; transform: translateY(.45em); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@media (prefers-reduced-motion: reduce) { .reveal.show *, .reveal.show .t .c { animation-duration: 1ms !important; animation-delay: 0s !important; } }
.bar.hide { display: none; }
.end { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; z-index: 3;
  background: radial-gradient(circle at 50% 40%, #233350, var(--stage) 75%); }
.end.on { display: flex; }
.end h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 6px; }
.end ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-family: var(--serif); }
.end li b { font-family: var(--latin); font-style: italic; color: var(--gold); margin-right: 8px; }
.bar { display: flex; align-items: center; gap: 12px; }
.dots { display: flex; gap: 6px; flex: 1; align-items: center; }
.dots span { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); }
.dots span.done { background: rgba(214,178,110,.5); border-color: var(--gold); }
.dots span.cur { background: var(--gold); border-color: var(--gold-hi); box-shadow: 0 0 10px rgba(240,217,162,.6); }
.dots em { font-style: normal; font-size: 13px; color: var(--muted); margin-left: 6px; }
.pts { font-family: var(--latin); font-weight: 700; font-size: 22px; color: var(--gold-hi); font-variant-numeric: lining-nums; }
.pts small { font-family: var(--serif); font-size: 13px; color: var(--gold); margin-left: 2px; }
button.next { width: 100%; font: 700 18px var(--serif); color: var(--ink); background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, #9b7a3e);
  border: 0; border-radius: 3px; padding: 14px; cursor: pointer; letter-spacing: .04em; }
button.next:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
.hint { text-align: center; font-size: 12px; color: var(--muted); margin: 0; }
</style>
<div class="app">
  <header>
    <div class="rno" id="rno">Round I<span>of IV</span></div>
    <div class="fx" id="fxname"></div>
  </header>
  <p class="desc" id="desc"></p>
  <div class="stage">
    <div id="box" role="button" tabindex="0" aria-label="표지. 누르면 다음으로"></div>
    <div class="end" id="end"><h2>연습 끝!</h2><ol id="endList"></ol></div>
  </div>
  <div class="bar" id="bar"><div class="dots" id="dots"></div><div class="pts" id="pts"></div></div>
  <div class="reveal" id="reveal" aria-live="polite">
    <div class="ey"><span class="ln"></span><span class="tx" id="ansEy">ROUND I · 정답</span><span class="ln"></span></div>
    <div class="t" id="ansT"></div>
    <div class="s" id="ansS"></div>
  </div>
  <button class="next" id="next" type="button">다음</button>
  <p class="hint">다음 버튼(또는 표지 탭, → 키)만 누르면 힌트 → 정답 → 다음 라운드로 넘어가요</p>
</div>
</script>
<script src="cover-fx.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const ROMAN = ['I', 'II', 'III', 'IV'];
  // 라운드 4개, 순서 고정, 라운드마다 ★ 지정 효과 하나 (본편과 같은 설정)
  const ROUNDS = [
    { src: 'covers/1.jpg', answer: '무서운 게 딱! 좋아!', sub: '이구성 · 딱이야 시리즈 1 (ILB, 2002)', effect: 'titlemask',
      regions: [{ x: 0.15, y: 0.245, w: 0.7, h: 0.37 }] },
    { src: 'covers/2.jpg', answer: '해리 포터와 마법사의 돌', sub: 'J.K. 롤링 · 문학수첩 1999년판 1권 (구표지)', effect: 'tiles',
      opts: { key: [{ x: 0.67, y: 0.5, r: 0.5 }], open: [0.14, 0.28, 0.44, 0.6] },
      regions: [{ x: 0.1, y: 0, w: 0.82, h: 0.25 }, { x: 0.27, y: 0.26, w: 0.52, h: 0.13 }, { x: 0.25, y: 0.845, w: 0.5, h: 0.045 }] },
    { src: 'covers/3.jpg', answer: '지구 끝의 온실', sub: '김초엽 · 자이언트북스 (2021)', effect: 'steam',
      regions: [{ x: 0.2, y: 0.07, w: 0.6, h: 0.165 }, { x: 0.3, y: 0.79, w: 0.4, h: 0.05 }] },
    { src: 'covers/4.jpg', answer: '물고기는 존재하지 않는다', sub: '룰루 밀러 · 곰출판 (2021)', effect: 'spotlight',
      opts: { area: { x: 0.12, y: 0.12, w: 0.76, h: 0.56 } },
      regions: [{ x: 0.17, y: 0.05, w: 0.66, h: 0.27 }, { x: 0.28, y: 0.64, w: 0.44, h: 0.075 }, { x: 0.9, y: 0.45, w: 0.08, h: 0.17 }] },
  ];
  ROUNDS.forEach((r) => { const i = new Image(); i.src = r.src; }); // 미리 불러오기
  const fx = CoverFX.create('#box', { padding: 0.03, duration: 1050, onChange: render });
  let ri = 0, ended = false;

  function load(i) {
    ri = i; ended = false;
    const r = ROUNDS[i];
    hideReveal();
    $('#end').classList.remove('on');
    fx.setOptions({ regions: r.regions, text: r.answer, protect: true });
    fx.setEffect(r.effect, r.opts);
    fx.setImage(r.src);
    render();
  }
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function showReveal(r) {
    let n = 0;
    $('#ansEy').textContent = 'ROUND ' + ROMAN[ri] + ' · 정답';
    $('#ansT').innerHTML = r.answer.split(' ').map((w) => '<span class="w">' + Array.from(w).map((ch) => '<span class="c" style="--i:' + (n++) + '">' + esc(ch) + '</span>').join('') + '</span>').join(' ');
    $('#ansS').textContent = r.sub;
    const el = $('#reveal');
    el.style.setProperty('--after', (0.6 + n * 0.055 + 0.35).toFixed(2) + 's');
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    $('#bar').classList.add('hide');
  }
  function hideReveal() { $('#reveal').classList.remove('show'); $('#bar').classList.remove('hide'); }
  function pts() {
    const S = fx.stages, k = Math.min(fx.stage, S - 1);
    return S <= 1 ? 30 : Math.round(30 - (20 * k) / (S - 1));
  }
  function render() {
    if (!fx.stages) return;
    $('#rno').innerHTML = 'Round ' + ROMAN[ri] + '<span>of IV</span>';
    $('#fxname').textContent = ended ? '' : fx.label;
    $('#desc').textContent = ended ? '' : fx.desc;
    let d = '';
    for (let k = 0; k <= fx.stages; k++) d += '<span class="' + (k < fx.stage ? 'done' : k === fx.stage ? 'cur' : '') + '"></span>';
    $('#dots').innerHTML = d + '<em>' + (fx.revealed ? '정답 공개' : '힌트 ' + (fx.stage + 1) + ' / ' + fx.stages) + '</em>';
    $('#pts').innerHTML = fx.revealed ? '' : pts() + '<small>점</small>';
    $('#next').textContent = ended ? '처음부터 다시' : fx.revealed ? (ri < ROUNDS.length - 1 ? '다음 라운드' : '결과 보기') : fx.stage === fx.stages - 1 ? '정답 공개' : '다음 힌트';
  }
  function next() {
    if (ended) { load(0); return; }
    if (!fx.revealed) {
      if (fx.stage === fx.stages - 1) {
        fx.reveal();
        showReveal(ROUNDS[ri]);
      } else fx.next();
    } else if (ri < ROUNDS.length - 1) load(ri + 1);
    else {
      ended = true;
      $('#endList').innerHTML = ROUNDS.map((r, i) => '<li><b>' + ROMAN[i] + '</b>' + r.answer + '</li>').join('');
      hideReveal();
      $('#end').classList.add('on');
    }
    render();
  }
  $('#next').onclick = next;
  $('#box').addEventListener('click', next);
  $('#box').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); next(); } });
  document.addEventListener('keydown', (e) => {
    if (['ArrowRight', ' ', 'PageDown'].includes(e.key) && e.target.tagName !== 'BUTTON') { e.preventDefault(); next(); }
  });
  load(0);
})();
</script>
</body></html>
