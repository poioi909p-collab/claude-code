<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<style>@font-face{font-family:"IBM Plex Sans KR";font-weight:400;src:url("fonts/IBMPlexSansKR-Regular.woff2") format("woff2")}@font-face{font-family:"IBM Plex Sans KR";font-weight:500;src:url("fonts/IBMPlexSansKR-Medium.woff2") format("woff2")}@font-face{font-family:"IBM Plex Sans KR";font-weight:700;src:url("fonts/IBMPlexSansKR-Bold.woff2") format("woff2")}@font-face{font-family:"Instrument Serif";font-style:normal;src:url("fonts/InstrumentSerif-Regular.woff2") format("woff2")}@font-face{font-family:"Instrument Serif";font-style:italic;src:url("fonts/InstrumentSerif-Italic.woff2") format("woff2")}</style>
<title>북 퀴즈 연습</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* 컨셉: 연말 책 전시회. 갤러리 벽 같은 웜 차콜 + 라운드마다 표지에서 뽑은 포인트 색 하나.
   본문은 모던 산세리프, 숫자와 라벨은 에디토리얼 세리프 이탤릭. */
:root {
  --bg: #121110; --bg-2: #1b1a18; --text: #f3efe7; --muted: #8e8981; --line: rgba(243,239,231,.14);
  --accent: #f2c500; --on-accent: #121110;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --serif: "Instrument Serif", "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--text); }
body { margin: 0; font-family: var(--sans); font-size: 15px; letter-spacing: -0.01em;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 16px;
  background:
    radial-gradient(ellipse 90% 55% at 50% 38%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
    var(--bg);
  transition: background .8s; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .09; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.app { position: relative; max-width: 560px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* 상단: 번호 · 효과 · 진행 */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.no { font-family: var(--serif); font-size: 26px; line-height: 1; }
.no i { font-style: italic; color: var(--accent); margin-right: 4px; }
.no small { font-family: var(--sans); font-size: 12px; color: var(--muted); margin-left: 6px; letter-spacing: .02em; }
.fxname { font-size: 14px; font-weight: 500; color: var(--muted); }
.fxname b { color: var(--text); font-weight: 700; }
.prog { display: flex; gap: 4px; }
.prog span { flex: 1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; position: relative; }
.prog span::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .6s cubic-bezier(.3,.8,.2,1); }
.prog span.on::after { transform: scaleX(1); }

/* 표지 무대 */
.stage { position: relative; flex: 1; min-height: 300px; border-radius: 18px; overflow: hidden; background: var(--bg-2);
  box-shadow: inset 0 0 0 1px var(--line); }
#box { position: absolute; inset: 0; cursor: pointer; }

/* 하단 정보: 점수 · 설명 */
.meta { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: end; min-height: 74px; }
.pts { font-family: var(--serif); font-size: 64px; line-height: .8; font-variant-numeric: lining-nums; }
.pts small { font-family: var(--sans); font-size: 13px; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.desc { margin: 0; font-size: 13px; line-height: 1.55; color: var(--muted); word-break: keep-all; padding-bottom: 4px; }
.meta.hide { display: none; }

/* 정답: 전시 캡션 라벨 */
.label { display: none; min-height: 74px; }
.label.show { display: block; }
.label .ln { overflow: hidden; }
.label .ln > * { display: block; transform: translateY(105%); }
.label.show .ln > * { animation: up .9s cubic-bezier(.2,.8,.15,1) forwards; animation-delay: var(--d, 0s); }
.label .k { font-family: var(--serif); font-size: 17px; color: var(--accent); }
.label .k i { font-style: italic; }
.label .t { font-size: 27px; font-weight: 700; line-height: 1.2; letter-spacing: -0.03em; padding: 2px 0 4px; word-break: keep-all; text-wrap: balance; }
.label .a { font-size: 15px; font-weight: 500; }
.label .m { font-size: 12.5px; color: var(--muted); padding-top: 2px; }
.label .bar { height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: left; margin: 8px 0 10px; width: 48px; }
.label.show .bar { animation: grow .8s .1s cubic-bezier(.3,.8,.2,1) forwards; }
@keyframes up { to { transform: none; } }
@keyframes grow { to { transform: scaleX(1); } }

/* 버튼 */
button.next { width: 100%; font: 700 16px var(--sans); letter-spacing: -0.01em; color: var(--bg); background: var(--text);
  border: 0; border-radius: 14px; padding: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: transform .15s, background .3s; }
button.next:active { transform: scale(.985); }
button.next:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button.next .arr { font-family: var(--serif); font-style: italic; font-size: 20px; font-weight: 400; }

/* 시작 화면: 잡지 표지 + 목차 */
.intro { position: absolute; inset: 0 0 72px 0; z-index: 10; display: none; flex-direction: column; justify-content: space-between; gap: 18px; padding: 6px 2px 0; background: transparent; }
.intro.on { display: flex; }
.app.intro-mode > .top, .app.intro-mode > .prog, .app.intro-mode > .stage, .app.intro-mode > .meta { visibility: hidden; }
.intro .eyebrow { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.intro .mast { font-family: var(--serif); font-style: italic; font-size: clamp(44px, 14vw, 72px); line-height: .9; color: var(--accent); margin-top: 18px; }
.intro h1 { margin: 6px 0 0; font-size: clamp(38px, 11.5vw, 60px); font-weight: 700; line-height: 1.04; letter-spacing: -0.05em; word-break: keep-all; }
.intro .lead { margin: 14px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); max-width: 30ch; }
.toc { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.toc li { display: grid; grid-template-columns: 44px 1fr auto; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line);
  opacity: 0; transform: translateY(10px); animation: tocIn .7s cubic-bezier(.2,.8,.2,1) forwards; }
.toc li b { font-family: var(--serif); font-weight: 400; font-size: 22px; }
.toc li span { font-weight: 500; }
.toc li em { font-style: normal; font-size: 12px; color: var(--muted); }
.toc li .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
@keyframes tocIn { to { opacity: 1; transform: none; } }

/* 라운드 카드: 라운드 색으로 화면을 덮었다가 위로 걷힘 */
.card { position: absolute; inset: -14px -16px; z-index: 20; display: none; flex-direction: column; justify-content: flex-end; padding: 28px 24px 40px;
  background: var(--accent); color: var(--on-accent); clip-path: inset(100% 0 0 0); }
.card.on { display: flex; animation: cardIn .7s cubic-bezier(.7,0,.2,1) forwards; }
.card.out { animation: cardOut .6s cubic-bezier(.7,0,.2,1) forwards; }
.card .ey { font-size: 13px; font-weight: 500; letter-spacing: .04em; opacity: .7; }
.card .num { font-family: var(--serif); font-size: clamp(120px, 42vw, 200px); line-height: .82; letter-spacing: -0.04em; margin: 6px 0 14px; }
.card .num i { font-style: italic; }
.card .nm { font-size: 30px; font-weight: 700; letter-spacing: -0.04em; }
.card .ds { font-size: 14px; margin-top: 8px; opacity: .75; max-width: 30ch; line-height: 1.5; word-break: keep-all; }
@keyframes cardIn { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes cardOut { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 100% 0); } }

/* 끝 화면: 오늘의 네 권 */
.end { position: absolute; inset: 0 0 72px 0; z-index: 10; display: none; flex-direction: column; gap: 16px; background: var(--bg); padding-top: 6px; }
.end.on { display: flex; }
.end .mast { font-family: var(--serif); font-style: italic; font-size: 44px; line-height: 1; color: var(--text); }
.end h2 { margin: 0; font-size: 24px; letter-spacing: -0.04em; }
.end { overflow-y: auto; }
.end .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; align-content: start; }
.end figure { margin: 0; opacity: 0; transform: translateY(12px); animation: tocIn .8s cubic-bezier(.2,.8,.2,1) forwards; }
.end figure img { width: 100%; aspect-ratio: 4 / 5; object-position: top; object-fit: cover; border-radius: 10px; display: block; box-shadow: 0 10px 24px rgba(0,0,0,.4); }
.end figcaption { margin-top: 8px; font-size: 13px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; word-break: keep-all; }
.end figcaption b { font-family: var(--serif); font-weight: 400; font-style: italic; color: var(--muted); margin-right: 4px; }
.end figcaption span { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
@media (prefers-reduced-motion: reduce) { .label.show .ln > *, .label.show .bar, .toc li, .end figure, .card.on, .card.out { animation-duration: 1ms !important; animation-delay: 0s !important; } }
</style>
<div class="app intro-mode" id="app">
  <div class="top">
    <div class="no" id="no"><i>No.</i>01<small>/ 04</small></div>
    <div class="fxname" id="fxname"></div>
  </div>
  <div class="prog" id="prog"></div>
  <div class="stage">
    <div id="box" role="button" tabindex="0" aria-label="표지. 누르면 다음으로"></div>
  </div>
  <div class="meta" id="meta"><div class="pts" id="pts"></div><p class="desc" id="desc"></p></div>
  <div class="label" id="label" aria-live="polite">
    <div class="ln"><div class="k" id="lk"></div></div>
    <div class="ln"><div class="t" id="lt"></div></div>
    <div class="bar"></div>
    <div class="ln"><div class="a" id="la"></div></div>
    <div class="ln"><div class="m" id="lm"></div></div>
  </div>
  <button class="next" id="next" type="button"><span id="nextTx">시작하기</span><span class="arr">→</span></button>

  <section class="intro on" id="intro" aria-label="시작 화면">
    <div>
      <div class="eyebrow"><span>2026 송년회</span><span>연습판</span></div>
      <div class="mast">Book Quiz</div>
      <h1>표지 보고<br>책 제목 맞히기</h1>
      <p class="lead">익숙한 책 표지가 낯설게 변신했어요. 힌트가 하나씩 열릴수록 점수는 줄어듭니다.</p>
    </div>
    <ol class="toc" id="toc"></ol>
  </section>
  <section class="end" id="end" aria-label="결과">
    <div><div class="mast">Fin.</div><h2>오늘의 네 권</h2></div>
    <div class="grid" id="endGrid"></div>
  </section>
  <div class="card" id="card"><div class="ey" id="cardEy">Round</div><div class="num" id="cardNum"></div><div class="nm" id="cardNm"></div><div class="ds" id="cardDs"></div></div>
</div>
</script>
<script src="cover-fx.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const two = (n) => String(n).padStart(2, '0');
  // 라운드 4개, 순서 고정, 라운드마다 ★ 지정 효과 하나. accent: 표지에서 뽑은 색
  const ROUNDS = [
    { src: 'covers/1.jpg', answer: '무서운 게 딱! 좋아!', author: '이구성', meta: 'ILB · 2002 · 딱이야 시리즈 1', accent: '#f2c500', ink: '#121110',
      effect: 'shuffle', opts: { layout: 'frame', pos0: [21, 19, 17, 15, 23, 7, 10, 20, 4, 11, 16, 24, 2, 22, 8, 5, 14, 0, 12, 6, 9, 3, 18, 1, 13], invSlots: [6, 8, 16, 18] },
      regions: [{ x: 0.15, y: 0.245, w: 0.7, h: 0.37 }] },
    { src: 'covers/2.jpg', answer: '해리 포터와 마법사의 돌', author: 'J.K. 롤링', meta: '문학수첩 · 1999 · 1권 (구표지)', accent: '#e09a45', ink: '#121110',
      effect: 'tiles', opts: { key: [{ x: 0.67, y: 0.5, r: 0.5 }], open: [0.14, 0.28, 0.44, 0.6] },
      regions: [{ x: 0.1, y: 0, w: 0.82, h: 0.25 }, { x: 0.27, y: 0.26, w: 0.52, h: 0.13 }, { x: 0.25, y: 0.845, w: 0.5, h: 0.045 }] },
    { src: 'covers/3.jpg', answer: '지구 끝의 온실', author: '김초엽', meta: '자이언트북스 · 2021', accent: '#f19bb8', ink: '#121110',
      effect: 'steam',
      regions: [{ x: 0.2, y: 0.07, w: 0.6, h: 0.165 }, { x: 0.3, y: 0.79, w: 0.4, h: 0.05 }] },
    { src: 'covers/4.jpg', answer: '물고기는 존재하지 않는다', author: '룰루 밀러', meta: '곰출판 · 2021 · 정지인 옮김', accent: '#48b07a', ink: '#121110',
      effect: 'spotlight', opts: { area: { x: 0.12, y: 0.12, w: 0.76, h: 0.56 } },
      regions: [{ x: 0.17, y: 0.05, w: 0.66, h: 0.27 }, { x: 0.28, y: 0.64, w: 0.44, h: 0.075 }, { x: 0.9, y: 0.45, w: 0.08, h: 0.17 }] },
  ];
  ROUNDS.forEach((r) => { const i = new Image(); i.src = r.src; });
  const label = (r) => (CoverFX.get(r.effect) || {}).label || r.effect;
  const hintsOf = (r) => { const d = CoverFX.get(r.effect); return typeof d.stages === 'function' ? d.stages(Object.assign({}, d.defaults, r.opts || {})) : d.stages; };
  const fx = CoverFX.create('#box', { padding: 0.04, duration: 1050, onChange: render });
  let ri = 0, ended = false, inIntro = true, cardT = 0;

  // 시작 화면 목차
  $('#toc').innerHTML = ROUNDS.map((r, i) => '<li style="animation-delay:' + (0.15 + i * 0.08) + 's"><b>' + two(i + 1) + '</b><span><i class="dot" style="background:' + r.accent + '"></i>' + esc(label(r)) + '</span><em>힌트 ' + hintsOf(r) + '</em></li>').join('');

  function setAccent(r) {
    document.documentElement.style.setProperty('--accent', r.accent);
    document.documentElement.style.setProperty('--on-accent', r.ink);
  }
  function showCard() {
    const r = ROUNDS[ri], c = $('#card');
    $('#cardEy').textContent = 'Round ' + two(ri + 1) + ' / 04';
    $('#cardNum').innerHTML = '<i>No.</i>' + two(ri + 1);
    $('#cardNm').textContent = label(r);
    $('#cardDs').textContent = (CoverFX.get(r.effect) || {}).desc || '';
    c.classList.remove('on', 'out'); void c.offsetWidth; c.classList.add('on');
    clearTimeout(cardT); cardT = setTimeout(hideCard, 1900);
  }
  function hideCard() {
    const c = $('#card');
    if (!c.classList.contains('on') || c.classList.contains('out')) return;
    clearTimeout(cardT);
    c.classList.add('out');
    fx.setEffect(ROUNDS[ri].effect, ROUNDS[ri].opts); // 카드가 걷히는 순간 등장 연출 시작
    setTimeout(() => c.classList.remove('on', 'out'), 620);
  }
  function load(i) {
    ri = i; ended = false;
    const r = ROUNDS[i];
    setAccent(r);
    hideLabel();
    $('#end').classList.remove('on');
    fx.setOptions({ regions: r.regions, text: r.answer, protect: true });
    fx.setEffect(r.effect, r.opts);
    fx.setImage(r.src);
    showCard();
    render();
  }
  function pts() {
    const S = fx.stages, k = Math.min(fx.stage, S - 1);
    return S <= 1 ? 30 : Math.round(30 - (20 * k) / (S - 1));
  }
  function showLabel(r) {
    $('#lk').innerHTML = '<i>No.</i> ' + two(ri + 1) + ' — 정답';
    $('#lt').textContent = r.answer;
    $('#la').textContent = r.author;
    $('#lm').textContent = r.meta;
    const el = $('#label');
    const lines = el.querySelectorAll('.ln > *');
    lines.forEach((n, k) => n.style.setProperty('--d', (0.35 + k * 0.12).toFixed(2) + 's'));
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    $('#meta').classList.add('hide');
  }
  function hideLabel() { $('#label').classList.remove('show'); $('#meta').classList.remove('hide'); }
  function setBtn(t) { $('#nextTx').textContent = t; }
  function render() {
    if (inIntro) {
      $('#no').innerHTML = '<i>No.</i>00<small>/ 04</small>';
      $('#fxname').textContent = ''; $('#prog').innerHTML = '';
      $('#meta').classList.add('hide');
      setBtn('시작하기');
      return;
    }
    if (!fx.stages) return;
    $('#no').innerHTML = '<i>No.</i>' + two(ri + 1) + '<small>/ 04</small>';
    $('#fxname').innerHTML = ended ? '' : '<b>' + esc(fx.label) + '</b> · ' + (fx.revealed ? '정답' : '힌트 ' + (fx.stage + 1) + '/' + fx.stages);
    let p = '';
    for (let k = 0; k < fx.stages; k++) p += '<span class="' + (k <= fx.stage ? 'on' : '') + '"></span>';
    $('#prog').innerHTML = p;
    $('#pts').innerHTML = pts() + '<small>점</small>';
    $('#desc').textContent = '지금 맞히면 ' + pts() + '점. ' + fx.desc;
    setBtn(ended ? '처음부터 다시' : fx.revealed ? (ri < ROUNDS.length - 1 ? '다음 책' : '결과 보기') : fx.stage === fx.stages - 1 ? '정답 보기' : '다음 힌트');
  }
  function next() {
    if (inIntro) { inIntro = false; $('#intro').classList.remove('on'); $('#app').classList.remove('intro-mode'); $('#meta').classList.remove('hide'); load(0); return; }
    if ($('#card').classList.contains('on')) { hideCard(); return; }
    if (ended) { load(0); return; }
    if (!fx.revealed) {
      if (fx.stage === fx.stages - 1) { fx.reveal(); showLabel(ROUNDS[ri]); }
      else fx.next();
    } else if (ri < ROUNDS.length - 1) load(ri + 1);
    else {
      ended = true;
      document.documentElement.style.setProperty('--accent', '#f3efe7');
      $('#endGrid').innerHTML = ROUNDS.map((r, i) => '<figure style="animation-delay:' + (0.1 + i * 0.1) + 's"><img src="' + r.src + '" alt=""><figcaption><b>' + two(i + 1) + '</b>' + esc(r.answer) + '<span>' + esc(r.author) + '</span></figcaption></figure>').join('');
      hideLabel();
      $('#end').classList.add('on');
    }
    render();
  }
  $('#next').onclick = next;
  $('#card').addEventListener('click', hideCard);
  $('#box').addEventListener('click', next);
  $('#box').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); next(); } });
  document.addEventListener('keydown', (e) => {
    if (['ArrowRight', ' ', 'PageDown'].includes(e.key) && e.target.tagName !== 'BUTTON') { e.preventDefault(); next(); }
  });
  render();
})();
</script>
</body></html>
