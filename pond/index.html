<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>연못</title>
<meta name="theme-color" content="#0a1213">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200&display=swap&text=%EB%AC%BC%EC%9D%84%20%EB%A7%8C%EC%A0%B8%EB%B3%B4%EC%84%B8%EC%9A%94">
<style>
/* 한 화면 전체가 연못. 물(WebGL) 위에 수면 레이어(2D), 그 위에 글자 한 줄. */
:root {
  --ink: #0a1213;        /* 먹색 */
  --deep-teal: #14393a;  /* 깊은 청록 */
  --cream: #efe6d4;      /* 크림 */
  --apricot: #e6b08c;    /* 살구 */
  --vermilion: #c4573f;  /* 주홍 */
  --lotus: #5d7a4c;      /* 연잎 초록 */
  --blossom: #e9bcc0;    /* 연분홍 */
  --serif: 'Noto Serif KR', 'Nanum Myeongjo', 'AppleMyungjo', 'Batang', serif;
  color-scheme: dark;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--ink);
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#pond {
  position: fixed;
  inset: 0;
  background: var(--ink);
  touch-action: none;
}
#pond canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
#veil {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 58%, rgba(6, 11, 12, 0.42) 100%);
}
#hint {
  position: fixed;
  left: 0;
  right: 0;
  top: 44%;
  margin: 0;
  text-align: center;
  font-family: var(--serif);
  font-weight: 200;
  font-size: clamp(17px, 4.8vw, 25px);
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  color: var(--cream);
  text-shadow: 0 0 24px rgba(10, 18, 19, 0.85);
  opacity: 0;
  filter: blur(4px);
  transform: translateY(6px);
  pointer-events: none;
  transition:
    opacity 3.2s cubic-bezier(0.25, 0.1, 0.25, 1),
    filter 3.2s cubic-bezier(0.25, 0.1, 0.25, 1),
    transform 3.6s cubic-bezier(0.22, 0.61, 0.36, 1),
    letter-spacing 3.6s cubic-bezier(0.22, 0.61, 0.36, 1);
}
#hint.on { opacity: 0.8; filter: blur(0); transform: none; }
#hint.gone { opacity: 0; filter: blur(5px); letter-spacing: 0.62em; transform: translateY(-4px); }
#hint span { display: inline-block; animation: breathe 6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.62; } }
#sound {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 14px);
  width: 40px;
  height: 40px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid rgba(239, 230, 212, 0.16);
  background: rgba(10, 18, 19, 0.3);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  color: var(--cream);
  opacity: 0.5;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.9s cubic-bezier(0.25, 0.1, 0.25, 1), border-color 0.9s ease;
}
#sound:hover { opacity: 0.75; }
#sound[aria-pressed="true"] { opacity: 0.85; border-color: rgba(233, 188, 192, 0.35); }
#sound:focus-visible { outline: 1px solid rgba(239, 230, 212, 0.6); outline-offset: 3px; }
#sound path { transition: opacity 0.8s ease; }
#sound .on { opacity: 0; }
#sound[aria-pressed="true"] .on { opacity: 1; }
#sound[aria-pressed="true"] .off { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  #hint span { animation: none; }
}
</style>
</head>
<body>
<div id="pond" aria-label="물고기가 사는 작은 연못. 화면을 만지면 물결이 일어요." role="img">
  <canvas id="water"></canvas>
  <canvas id="surface"></canvas>
</div>
<div id="veil" aria-hidden="true"></div>
<p id="hint"><span>물을 만져보세요</span></p>
<button id="sound" type="button" aria-label="소리 켜기" aria-pressed="false">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3l4.5-3.5v12L7 14.5H4z"/>
    <path class="on" d="M15 9.2a4 4 0 0 1 0 5.6M17.6 6.8a7.4 7.4 0 0 1 0 10.4"/>
    <path class="off" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>
  </svg>
</button>

<script>
(() => {
'use strict';

/* ============================================================
   공통
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const stage = document.getElementById('pond');
const glCanvas = document.getElementById('water');
const fxCanvas = document.getElementById('surface');
const fx = fxCanvas.getContext('2d');
const hint = document.getElementById('hint');

let W = 0, H = 0;           // CSS px
let DPR = 1;                // 기기 픽셀 비율
let RS = 1;                 // 물 렌더 배율 (성능에 따라 자동 조정)
let FXS = 1;                // 수면 레이어 배율
let now = 0;                // 초

/* ============================================================
   물결 — 높이맵 시뮬레이션 (CPU, 60Hz 고정 스텝)
   ============================================================ */
const sim = { cell: 4, cols: 0, rows: 0, cur: null, prev: null, damp: null, bytes: null };
const C2 = 0.3;            // 파동 속도² (셀/스텝)
const DAMP = 0.988;        // 속도 감쇠
const GMAX = 0.55;         // 기울기 인코딩 범위
const LMAX = 0.5;          // 곡률 인코딩 범위

function initSim() {
  const cell = Math.max(3.5, Math.sqrt((W * H) / 52000));
  sim.cell = cell;
  sim.cols = Math.ceil(W / cell) + 3;
  sim.rows = Math.ceil(H / cell) + 3;
  const n = sim.cols * sim.rows;
  sim.cur = new Float32Array(n);
  sim.prev = new Float32Array(n);
  sim.bytes = new Uint8Array(n * 4);
  for (let i = 0; i < n; i++) { sim.bytes[i * 4] = sim.bytes[i * 4 + 1] = sim.bytes[i * 4 + 2] = 128; sim.bytes[i * 4 + 3] = 255; }
  // 가장자리는 물결을 조금 더 빨리 잠재워서 벽 반사가 거슬리지 않게
  sim.damp = new Float32Array(n);
  const band = 7;
  for (let y = 0; y < sim.rows; y++) {
    for (let x = 0; x < sim.cols; x++) {
      const d = Math.min(x, y, sim.cols - 1 - x, sim.rows - 1 - y);
      sim.damp[y * sim.cols + x] = d >= band ? 1 : 1 - 0.05 * (1 - d / band);
    }
  }
}

function simStep() {
  const { cols, rows, damp } = sim;
  const cur = sim.cur, prev = sim.prev;
  for (let y = 1; y < rows - 1; y++) {
    let i = y * cols + 1;
    for (let x = 1; x < cols - 1; x++, i++) {
      const c = cur[i];
      // 9점 라플라시안: 물결이 네모나지 않고 동그랗게 퍼짐
      const lap = (4 * (cur[i - 1] + cur[i + 1] + cur[i - cols] + cur[i + cols])
        + cur[i - cols - 1] + cur[i - cols + 1] + cur[i + cols - 1] + cur[i + cols + 1]
        - 20 * c) / 6;
      prev[i] = (c + (c - prev[i]) * DAMP + C2 * lap) * 0.9993 * damp[i];
    }
  }
  sim.cur = prev; sim.prev = cur;
}

function enc(v) {
  v = v > 1 ? 1 : v < -1 ? -1 : v;
  return (128.5 + (v < 0 ? -Math.sqrt(-v) : Math.sqrt(v)) * 127) | 0;
}
// 기울기(R,G)와 곡률(B)을 텍스처로 — 작은 물결도 정밀하게 sqrt 인코딩
function encodeSim() {
  const { cols, rows, bytes } = sim;
  const h = sim.cur;
  for (let y = 1; y < rows - 1; y++) {
    let i = y * cols + 1, j = i * 4;
    for (let x = 1; x < cols - 1; x++, i++, j += 4) {
      const gx = (h[i + 1] - h[i - 1]) * 0.5;
      const gy = (h[i + cols] - h[i - cols]) * 0.5;
      const lap = h[i - 1] + h[i + 1] + h[i - cols] + h[i + cols] - 4 * h[i];
      bytes[j] = enc(gx / GMAX);
      bytes[j + 1] = enc(gy / GMAX);
      bytes[j + 2] = enc(lap / LMAX);
    }
  }
}

// 화면 좌표(px)에 부드러운 눌림을 더함 → 동심원
function disturb(px, py, rPx, amt) {
  const { cell, cols, rows } = sim;
  const cur = sim.cur, prev = sim.prev;
  const cx = px / cell + 1, cy = py / cell + 1;
  const r = Math.max(1.6, rPx / cell), r2 = r * r;
  const x0 = Math.max(1, Math.floor(cx - r)), x1 = Math.min(cols - 2, Math.ceil(cx + r));
  const y0 = Math.max(1, Math.floor(cy - r)), y1 = Math.min(rows - 2, Math.ceil(cy + r));
  for (let y = y0; y <= y1; y++) {
    const dy = y - cy;
    for (let x = x0; x <= x1; x++) {
      const dx = x - cx, d2 = dx * dx + dy * dy;
      if (d2 >= r2) continue;
      const f = 0.5 + 0.5 * Math.cos(Math.PI * Math.sqrt(d2 / r2));
      const i = y * cols + x;
      cur[i] -= amt * f;
      prev[i] -= amt * f * 0.55;
    }
  }
}

// 수면 기울기 (수면 위 물체가 물결에 밀리게 할 때 사용)
function slopeAt(px, py, out) {
  const { cell, cols, rows } = sim;
  const x = clamp(Math.round(px / cell + 1), 1, cols - 2);
  const y = clamp(Math.round(py / cell + 1), 1, rows - 2);
  const i = y * cols + x, h = sim.cur;
  out.x = (h[i + 1] - h[i - 1]) * 0.5;
  out.y = (h[i + cols] - h[i - cols]) * 0.5;
  out.h = h[i];
  return out;
}

/* ============================================================
   물살 — 성긴 속도장. 손가락이 지나간 길에 약한 흐름이 남음
   ============================================================ */
const flow = { cell: 26, cols: 0, rows: 0, vx: null, vy: null, tx: null, ty: null };
function initFlow() {
  flow.cols = Math.ceil(W / flow.cell) + 2;
  flow.rows = Math.ceil(H / flow.cell) + 2;
  const n = flow.cols * flow.rows;
  flow.vx = new Float32Array(n); flow.vy = new Float32Array(n);
  flow.tx = new Float32Array(n); flow.ty = new Float32Array(n);
}
function addFlow(px, py, vx, vy) {
  const gx = px / flow.cell, gy = py / flow.cell;
  const x0 = Math.floor(gx) - 1, y0 = Math.floor(gy) - 1;
  for (let y = y0; y <= y0 + 3; y++) {
    if (y < 0 || y >= flow.rows) continue;
    for (let x = x0; x <= x0 + 3; x++) {
      if (x < 0 || x >= flow.cols) continue;
      const dx = x + 0.5 - gx, dy = y + 0.5 - gy;
      const w = Math.exp(-(dx * dx + dy * dy) / 1.4);
      const i = y * flow.cols + x;
      flow.vx[i] += vx * w; flow.vy[i] += vy * w;
    }
  }
}
function stepFlow(dt) {
  const { cols, rows, vx, vy, tx, ty } = flow;
  const decay = Math.exp(-dt * 0.9), k = Math.min(1, dt * 6);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      const l = x > 0 ? i - 1 : i, r = x < cols - 1 ? i + 1 : i;
      const u = y > 0 ? i - cols : i, d = y < rows - 1 ? i + cols : i;
      tx[i] = lerp(vx[i], (vx[l] + vx[r] + vx[u] + vx[d]) * 0.25, k) * decay;
      ty[i] = lerp(vy[i], (vy[l] + vy[r] + vy[u] + vy[d]) * 0.25, k) * decay;
    }
  }
  flow.vx = tx; flow.vy = ty; flow.tx = vx; flow.ty = vy;
}
// 흐름 + 연못 전체의 아주 느린 맴돌이
function flowAt(px, py, out) {
  const gx = clamp(px / flow.cell - 0.5, 0, flow.cols - 1.001);
  const gy = clamp(py / flow.cell - 0.5, 0, flow.rows - 1.001);
  const x = gx | 0, y = gy | 0, fx_ = gx - x, fy_ = gy - y;
  const i = y * flow.cols + x, c = flow.cols;
  const x1 = x + 1 < flow.cols ? 1 : 0, y1 = y + 1 < flow.rows ? c : 0;
  const vx = flow.vx, vy = flow.vy;
  out.x = lerp(lerp(vx[i], vx[i + x1], fx_), lerp(vx[i + y1], vx[i + y1 + x1], fx_), fy_);
  out.y = lerp(lerp(vy[i], vy[i + x1], fx_), lerp(vy[i + y1], vy[i + y1 + x1], fx_), fy_);
  const cx = W * 0.5, cy = H * 0.52, dx = px - cx, dy = py - cy;
  const swirl = 0.011;
  out.x += -dy * swirl + Math.sin(now * 0.05 + py * 0.004) * 1.5;
  out.y += dx * swirl + Math.cos(now * 0.04 + px * 0.004) * 1.5;
  return out;
}

/* ============================================================
   연못 바닥 — 한 번 그려서 텍스처로 사용
   ============================================================ */
function makeBottom() {
  const s = Math.min(1.5, DPR, 1600 / Math.max(W, H));
  const bw = Math.max(2, Math.round(W * s)), bh = Math.max(2, Math.round(H * s));
  const c = document.createElement('canvas');
  c.width = bw; c.height = bh;
  const g = c.getContext('2d');
  const rnd = mulberry32(20261121);
  const L = Math.max(bw, bh);

  g.fillStyle = '#24362f';
  g.fillRect(0, 0, bw, bh);

  // 진흙과 모래의 얼룩
  for (let i = 0; i < 80; i++) {
    const x = rnd() * bw, y = rnd() * bh, r = (0.05 + rnd() * 0.25) * L;
    const light = rnd() < 0.45;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, light ? 'rgba(92,104,80,0.14)' : 'rgba(4,10,10,0.22)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // 가라앉은 잎
  for (let i = 0; i < 7; i++) {
    const x = rnd() * bw, y = rnd() * bh, len = (14 + rnd() * 18) * s, a = rnd() * TAU;
    g.save(); g.translate(x, y); g.rotate(a);
    g.fillStyle = `rgba(${44 + rnd() * 20 | 0},${34 + rnd() * 10 | 0},20,0.42)`;
    g.beginPath();
    g.moveTo(-len, 0);
    g.quadraticCurveTo(0, -len * 0.42, len, 0);
    g.quadraticCurveTo(0, len * 0.42, -len, 0);
    g.fill();
    g.strokeStyle = 'rgba(20,16,10,0.35)'; g.lineWidth = Math.max(0.6, s * 0.7);
    g.beginPath(); g.moveTo(-len * 0.95, 0); g.lineTo(len * 1.15, 0); g.stroke();
    g.restore();
  }

  // 조약돌 — 가장자리(얕은 곳)에 많고 가운데는 드물게
  const stoneCols = [[60, 70, 62], [74, 74, 63], [47, 61, 57], [86, 86, 72], [63, 58, 50], [52, 66, 52]];
  const count = Math.round((bw * bh) / (380 * s * s));
  for (let i = 0; i < count; i++) {
    const x = rnd() * bw, y = rnd() * bh;
    const e = Math.min(x / bw, 1 - x / bw, y / bh, 1 - y / bh);
    const shore = 1 - smoothstep(0.0, 0.24, e + (rnd() - 0.5) * 0.06);
    if (rnd() > 0.04 + 0.96 * Math.pow(shore, 1.6)) continue;
    const big = rnd() < 0.12;
    const r = (big ? 5 + rnd() * 7 + shore * 5 : 1.2 + rnd() * 3.2) * s;
    const ry = r * (0.62 + rnd() * 0.35), rot = rnd() * TAU;
    const [cr, cg, cb] = stoneCols[(rnd() * stoneCols.length) | 0];
    const v = 0.62 + rnd() * 0.42;
    g.save(); g.translate(x, y); g.rotate(rot);
    g.fillStyle = 'rgba(3,8,8,0.34)';
    g.beginPath(); g.ellipse(r * 0.18, r * 0.26, r * 1.08, ry * 1.1, 0, 0, TAU); g.fill();
    g.fillStyle = `rgb(${cr * v | 0},${cg * v | 0},${cb * v | 0})`;
    g.beginPath(); g.ellipse(0, 0, r, ry, 0, 0, TAU); g.fill();
    const hl = g.createRadialGradient(-r * 0.35, -ry * 0.45, 0, -r * 0.2, -ry * 0.25, r * 1.1);
    hl.addColorStop(0, big ? 'rgba(232,226,202,0.18)' : 'rgba(232,226,202,0.1)');
    hl.addColorStop(1, 'rgba(232,226,202,0)');
    g.fillStyle = hl;
    g.beginPath(); g.ellipse(0, 0, r, ry, 0, 0, TAU); g.fill();
    if (rnd() < 0.3) { // 이끼
      g.fillStyle = 'rgba(70,96,58,0.25)';
      g.beginPath(); g.ellipse(r * 0.2, ry * 0.2, r * 0.7, ry * 0.6, 0, 0, TAU); g.fill();
    }
    g.restore();
  }

  // 모래 알갱이
  const img = g.getImageData(0, 0, bw, bh), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * 14;
    d[i] += n; d[i + 1] += n; d[i + 2] += n * 0.8;
  }
  g.putImageData(img, 0, 0);

  // 물속이라 살짝 흐리게 (줄였다 키우기 — 모든 브라우저에서 동작)
  {
    const t = document.createElement('canvas');
    t.width = Math.max(2, Math.round(bw * 0.55)); t.height = Math.max(2, Math.round(bh * 0.55));
    const tg = t.getContext('2d');
    tg.imageSmoothingQuality = 'high';
    tg.drawImage(c, 0, 0, t.width, t.height);
    g.imageSmoothingQuality = 'high';
    g.drawImage(t, 0, 0, bw, bh);
  }

  // 물의 깊이: 왼쪽 위는 얕은 청록, 오른쪽 아래로 갈수록 먹색
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = '#8bbab0';
  g.fillRect(0, 0, bw, bh);
  g.globalCompositeOperation = 'source-over';
  const lg = g.createLinearGradient(bw * 0.05, 0, bw * 0.75, bh);
  lg.addColorStop(0, 'rgba(30,84,80,0.10)');
  lg.addColorStop(0.5, 'rgba(12,42,44,0.36)');
  lg.addColorStop(1, 'rgba(7,15,17,0.74)');
  g.fillStyle = lg;
  g.fillRect(0, 0, bw, bh);
  const cx = bw * 0.55, cy = bh * 0.55;
  const rg = g.createRadialGradient(cx, cy, 0, cx, cy, L * 0.5);
  rg.addColorStop(0, 'rgba(6,14,16,0.6)');
  rg.addColorStop(0.7, 'rgba(6,14,16,0.25)');
  rg.addColorStop(1, 'rgba(6,14,16,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, bw, bh);
  return c;
}

/* ============================================================
   WebGL — 굴절, 빛 모임, 수면 반짝임, 비네팅
   ============================================================ */
const VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;
const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform sampler2D uBottom;
uniform sampler2D uWave;
uniform vec2 uView;
uniform vec4 uSim;
uniform float uTime;
uniform float uRefract;
uniform float uNormal;
uniform sampler2D uFish;
uniform sampler2D uShadow;
uniform sampler2D uCaustic;

vec3 wave(vec2 suv) {
  vec3 e = texture2D(uWave, suv).rgb * (255.0 / 127.0) - (128.0 / 127.0);
  return sign(e) * e * e;
}
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

void main() {
  vec2 suv = vUv * uSim.xy + uSim.zw;
  vec3 w = wave(suv);
  vec2 g = w.xy * ${GMAX.toFixed(3)};
  float lap = w.z * ${LMAX.toFixed(3)};

  // 굴절: 기울어진 수면 너머로 바닥이 밀려 보임
  vec2 off = g * uRefract / uView;
  vec3 col = texture2D(uBottom, vUv - off).rgb;

  // 물결이 렌즈처럼 빛을 모으고 흩음 (마루 아래는 밝게, 골 아래는 어둡게)
  col *= clamp(1.0 - lap * 4.0, 0.6, 1.9);
  col += vec3(0.10, 0.16, 0.14) * clamp(-lap * 3.0, 0.0, 1.0);

  // 물고기 그림자: 바닥에 떨어지고, 굴절로 더 크게 일렁임
  float sh = texture2D(uShadow, vUv - off * 1.5).a;

  vec2 cp = (vUv * uView - off * uView * 1.2) / 240.0;
  float c1 = texture2D(uCaustic, cp + vec2(uTime * 0.011, uTime * 0.006)).r;
  float c2 = texture2D(uCaustic, mat2(0.8, -0.6, 0.6, 0.8) * cp * 1.31 + vec2(-uTime * 0.008, uTime * 0.012)).r;
  float caus = min(c1, c2);
  float shallow = 1.0 - smoothstep(0.0, 1.25, dot(vUv, vec2(0.55, 0.8)));
  col += vec3(0.80, 0.92, 0.78) * caus * (0.05 + 0.16 * shallow) * (1.0 - sh * 0.9);
  col *= 1.0 - sh * 0.62;
  // 물고기: 수면 가까이 있어서 굴절은 조금만
  vec4 fsh = texture2D(uFish, vUv - off * 0.55);
  col = fsh.rgb * clamp(1.0 - lap * 1.5, 0.8, 1.3) + col * (1.0 - fsh.a);

  // 수면 반사
  vec3 n = normalize(vec3(-g * uNormal, 1.0));
  vec3 Ld = normalize(vec3(-0.5, -0.66, 0.56));
  vec3 Hh = normalize(Ld + vec3(0.0, 0.0, 1.0));
  float nh = max(dot(n, Hh), 0.0);
  float spec = pow(nh, 50.0) * 0.28 + pow(nh, 360.0) * 0.9;
  col += vec3(1.0, 0.95, 0.86) * spec;
  float sky = dot(n.xy, -Ld.xy);
  col += vec3(0.30, 0.42, 0.40) * max(sky, 0.0) * 0.85 - col * clamp(-sky * 1.6, 0.0, 0.45);

  // 은은한 하늘빛 (왼쪽 위에서 들어오는 빛)
  float glow = 1.0 - smoothstep(0.0, 1.0, length((vUv - vec2(0.2, 0.1)) * vec2(1.0, uView.y / uView.x * 0.6)));
  col += vec3(0.07, 0.11, 0.10) * glow * glow;

  // 비네팅: 먹색으로 스며들게
  vec2 q = vUv - 0.5;
  q.x *= mix(1.0, uView.x / uView.y, 0.35) * 1.15;
  float v = smoothstep(0.32, 0.92, length(q) * 1.15);
  col = mix(col, vec3(0.024, 0.043, 0.047), v * 0.78);

  col += (hash(gl_FragCoord.xy + fract(uTime * 7.0)) - 0.5) / 255.0;
  gl_FragColor = vec4(col, 1.0);
}`;

let causticCache = null;
function causticData() {

   수면 위 — 떠다니는 작은 티끌 (물살이 눈에 보이게)
   ============================================================ */
const motes = [];
function initMotes() {
  motes.length = 0;
  const rnd = mulberry32(99);
  const n = Math.round(clamp((W * H) / 9000, 24, 70));
  for (let i = 0; i < n; i++) {
    motes.push({ x: rnd() * W, y: rnd() * H, r: 0.5 + rnd() * 1.1, a: 0.10 + rnd() * 0.22, ph: rnd() * TAU, vx: 0, vy: 0 });
  }
}
const tmpF = { x: 0, y: 0 }, tmpS = { x: 0, y: 0, h: 0 };
function updateMotes(dt) {
  for (const m of motes) {
    flowAt(m.x, m.y, tmpF);
    slopeAt(m.x, m.y, tmpS);
    // 물결의 경사를 따라 미끄러지고, 물살을 따라 흐름 (관성으로 부드럽게)
    const tx = tmpF.x - tmpS.x * 90 + Math.sin(now * 0.31 + m.ph) * 1.2;
    const ty = tmpF.y - tmpS.y * 90 + Math.cos(now * 0.27 + m.ph) * 1.2;
    const k = 1 - Math.exp(-dt * 2.2);
    m.vx += (tx - m.vx) * k; m.vy += (ty - m.vy) * k;
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.x < -10) m.x += W + 20; else if (m.x > W + 10) m.x -= W + 20;
    if (m.y < -10) m.y += H + 20; else if (m.y > H + 10) m.y -= H + 20;
  }
}

  fx.setTransform(FXS, 0, 0, FXS, 0, 0);

  for (const m of motes) {
    const tw = 0.75 + 0.25 * Math.sin(now * 0.8 + m.ph * 3);
    fx.fillStyle = `rgba(239,230,212,${(m.a * tw).toFixed(3)})`;
    fx.beginPath(); fx.arc(m.x, m.y, m.r, 0, TAU); fx.fill();
  }

}

/* ============================================================
   손가락 — 톡(동심원), 쓸기(물결 + 물살), 가만히 대기, 두 번 톡

const pointers = new Map();
let touched = false;

const listeners = { tap: [], doubleTap: [], hold: [], stir: [] };

function firstTouch() {
  if (touched) return;
  touched = true;
  hint.classList.remove('on');
  hint.classList.add('gone');
}

function onDown(e) {
  e.preventDefault();
  firstTouch();
  const x = e.clientX, y = e.clientY, t = performance.now() / 1000;
  pointers.set(e.pointerId, { x, y, lx: x, ly: y, lt: t, downT: t, downX: x, downY: y, moved: 0, stillT: 0, nextPulse: 1.2 });
  disturb(x, y, 10, 1.35);
  if (t - lastTap.t < 0.34 && Math.hypot(x - lastTap.x, y - lastTap.y) < 44) {
    lastTap.t = -1;
    for (const f of listeners.doubleTap) f(x, y);
  }
  for (const f of listeners.tap) f(x, y);
}

function moveTo(p, x, y, t) {
  const dx = x - p.lx, dy = y - p.ly, dist = Math.hypot(dx, dy);
  if (dist < 0.5) return;
  const dt = Math.max(1 / 240, t - p.lt);
  const speed = dist / dt;
  const n = Math.ceil(dist / (sim.cell * 0.9));
  const amt = clamp(speed / 2600, 0.03, 0.32) / Math.sqrt(n) * 0.9;
  const fvx = clamp(dx / dt, -900, 900) * 0.05, fvy = clamp(dy / dt, -900, 900) * 0.05;
  for (let k = 1; k <= n; k++) {
    const sx = p.lx + dx * (k / n), sy = p.ly + dy * (k / n);
    disturb(sx, sy, 10, amt);
    if (k === n || k % 3 === 0) addFlow(sx, sy, fvx, fvy);
  }
  for (const f of listeners.stir) f(x, y, speed);
  p.moved += dist;
  if (Math.hypot(x - p.downX, y - p.downY) > 8) { p.stillT = 0; p.downX = x; p.downY = y; }
  p.lx = x; p.ly = y; p.lt = t; p.x = x; p.y = y;
}

function onMove(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  const t = performance.now() / 1000;
  if (evs && evs.length > 1) for (const ce of evs) moveTo(p, ce.clientX, ce.clientY, t - (evs.length - 1 - evs.indexOf(ce)) / 240);
  else moveTo(p, e.clientX, e.clientY, t);
}

function onUp(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const t = performance.now() / 1000;
  if (t - p.downT < 0.3 && p.moved < 14) lastTap = { t, x: p.x, y: p.y };
  pointers.delete(e.pointerId);
}

// 손가락을 가만히 대고 있으면 아주 작은 떨림 물결
function updatePointers(dt) {
  for (const p of pointers.values()) {
    p.stillT += dt;
    if (p.stillT > p.nextPulse) {
      p.nextPulse = p.stillT + 1.3 + Math.random() * 0.6;
      disturb(p.x, p.y, 7, 0.16);
    }
    if (p.stillT > 0.6) for (const f of listeners.hold) f(p.x, p.y, p.stillT);
  }
}

function makePattern(kind, rnd) {
  const spots = [];

  const j = () => (rnd() - 0.5);

    case 'kohaku':

      for (let i = 0; i < 5; i++) patch(KC.ink, 0.22 + rnd() * 0.55, j() * 1.5, 0.026 + rnd() * 0.022, 1.15);
      return { base: KC.cream, fin: KC.cream, spots };

      patch(KC.verm, 0.12, j() * 0.12, 0.055 + rnd() * 0.02, 1.0);
      return { base: KC.cream, fin: KC.cream, spots };

      patch(KC.verm, 0.12, j() * 0.12, 0.06, 1.0);
      return { base: KC.peach, fin: KC.cream, spots };
    case 'chagoiPale':
      for (let i = 0; i < 10; i++) patch(KC.cream, 0.18 + rnd() * 0.6, j() * 1.3, 0.012, 1, 0.3);
      return { base: KC.paleApricot, fin: KC.paleApricot, spots };
    case 'showa':

  sc.setTransform(SS, 0, 0, SS, 0, 0);
  sc.clearRect(0, 0, W, H);
  fishOrder = fish.slice().sort((p, q) => q.depth - p.depth);
  for (const f of fishOrder) { buildFish(f); drawFishShadow(f); drawOneFish(f); }
  drawPadShadows();
}

/* ============================================================
   연잎 · 연꽃 — 가장자리에 떠서 물결에 살짝 흔들림
   ============================================================ */
const PAD_LAYOUT = [
  { u: 0.06, v: 0.1, s: 0.21, lotus: true },
  { u: 1.0, v: 0.5, s: 0.17 },
  { u: 0.12, v: 0.86, s: 0.23 },
  { u: 0.4, v: 0.985, s: 0.12 },
];
const pads = [];

function petalShape(g, len, wid) {
  g.beginPath();
  g.moveTo(0, 0);
  g.bezierCurveTo(len * 0.25, -wid * 0.9, len * 0.8, -wid * 0.75, len, 0);
  g.bezierCurveTo(len * 0.8, wid * 0.75, len * 0.25, wid * 0.9, 0, 0);
  g.closePath();
}
function paintLotus(g, R, rnd) {
  // 꽃 그림자 (연잎 위)
  g.fillStyle = 'rgba(20,36,22,0.35)';
  g.beginPath(); g.ellipse(R * 0.18, R * 0.24, R * 0.95, R * 0.9, 0, 0, TAU); g.fill();
  const rings = [
    { n: 9, len: 1.0, wid: 0.36, base: '#f3e2dd', tip: '#e2a7ae', off: 0 },
    { n: 7, len: 0.78, wid: 0.34, base: '#f6e7e3', tip: '#dd9aa4', off: 0.35 },
    { n: 5, len: 0.52, wid: 0.3, base: '#f8ece8', tip: '#d98f9b', off: 0.1 },
  ];
  for (const ring of rings) {
    for (let i = 0; i < ring.n; i++) {
      const a = (i / ring.n) * TAU + ring.off + (rnd() - 0.5) * 0.18;
      const len = R * ring.len * (0.92 + rnd() * 0.14), wid = R * ring.wid;
      g.save(); g.rotate(a);
      const gr = g.createLinearGradient(0, 0, len, 0);
      gr.addColorStop(0, ring.base); gr.addColorStop(0.55, ring.base); gr.addColorStop(1, ring.tip);
      g.fillStyle = gr;
      petalShape(g, len, wid); g.fill();
      g.strokeStyle = 'rgba(150,80,92,0.22)'; g.lineWidth = Math.max(0.5, R * 0.015); g.stroke();
      g.strokeStyle = 'rgba(180,110,120,0.16)';
      g.beginPath(); g.moveTo(len * 0.15, 0); g.lineTo(len * 0.85, 0); g.stroke();
      g.restore();
    }
  }
  // 연밥
  g.fillStyle = '#d6c47c';
  g.beginPath(); g.arc(0, 0, R * 0.17, 0, TAU); g.fill();
  g.fillStyle = 'rgba(120,110,50,0.55)';
  for (let i = 0; i < 6; i++) { const a = (i / 6) * TAU; g.beginPath(); g.arc(Math.cos(a) * R * 0.09, Math.sin(a) * R * 0.09, R * 0.022, 0, TAU); g.fill(); }
  g.beginPath(); g.arc(0, 0, R * 0.022, 0, TAU); g.fill();
}
function paintPad(pad) {
  const r = pad.r, S = FXS, size = Math.ceil(r * 2.3 * S);
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.setTransform(S, 0, 0, S, size / 2, size / 2);
  const rnd = mulberry32(pad.seed);
  const na = pad.notch, nw = 0.12;
  const cx = Math.cos(na) * r * 0.05, cy = Math.sin(na) * r * 0.05;
  const outline = () => {
    g.beginPath();
    g.moveTo(cx, cy);
    for (let k = 0; k <= 80; k++) {
      const a = na + nw + ((TAU - 2 * nw) * k) / 80;
      const rr = r * (1 + 0.016 * Math.sin(a * 5 + pad.seed) + 0.008 * Math.sin(a * 11 + pad.seed * 2));
      g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath();
  };
  outline();
  const gr = g.createRadialGradient(cx, cy, 0, 0, 0, r);
  gr.addColorStop(0, '#5e784a'); gr.addColorStop(0.55, '#4d683f'); gr.addColorStop(1, '#3b5233');
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  // 잎맥
  g.strokeStyle = 'rgba(190,206,156,0.12)';
  g.lineWidth = 0.9;
  for (let i = 0; i < 17; i++) {
    const a = na + nw * 1.4 + ((TAU - 2.8 * nw) * i) / 16, bend = (rnd() - 0.5) * 0.12;
    g.beginPath(); g.moveTo(cx, cy);
    g.quadraticCurveTo(Math.cos(a + bend) * r * 0.55, Math.sin(a + bend) * r * 0.55, Math.cos(a) * r, Math.sin(a) * r);
    g.stroke();
  }
  // 세월의 얼룩
  for (let i = 0; i < 5; i++) {
    const a = rnd() * TAU, d = r * (0.55 + rnd() * 0.4), sr = r * (0.05 + rnd() * 0.09);
    g.fillStyle = rnd() < 0.5 ? 'rgba(160,150,80,0.12)' : 'rgba(40,52,30,0.18)';
    g.beginPath(); g.arc(Math.cos(a) * d, Math.sin(a) * d, sr, 0, TAU); g.fill();
  }
  // 왁스 같은 윤기
  const sh = g.createRadialGradient(-r * 0.35, -r * 0.4, 0, -r * 0.35, -r * 0.4, r * 0.9);
  sh.addColorStop(0, 'rgba(240,245,220,0.13)'); sh.addColorStop(1, 'rgba(240,245,220,0)');
  g.fillStyle = sh; g.fillRect(-r, -r, r * 2, r * 2);
  // 가장자리 말림
  outline();
  g.strokeStyle = 'rgba(26,42,24,0.55)'; g.lineWidth = r * 0.06; g.stroke();
  g.restore();
  outline();
  g.strokeStyle = 'rgba(180,198,142,0.22)'; g.lineWidth = 0.8; g.stroke();
  // 물방울
  for (let i = 0; i < 3; i++) {
    const a = rnd() * TAU, d = r * (0.2 + rnd() * 0.5), dr = 1.2 + rnd() * 1.6;
    const x = Math.cos(a) * d, y = Math.sin(a) * d;
    g.fillStyle = 'rgba(20,34,20,0.25)'; g.beginPath(); g.arc(x + dr * 0.3, y + dr * 0.4, dr, 0, TAU); g.fill();
    g.fillStyle = 'rgba(215,228,200,0.22)'; g.beginPath(); g.arc(x, y, dr, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,250,0.7)'; g.beginPath(); g.arc(x - dr * 0.35, y - dr * 0.35, dr * 0.32, 0, TAU); g.fill();
  }
  if (pad.lotus) {
    g.save();
    g.translate(-Math.cos(na) * r * 0.22, -Math.sin(na) * r * 0.22);
    paintLotus(g, r * 0.46, rnd);
    g.restore();
  }
  pad.img = c; pad.size = size;
}
function initPads() {
  pads.length = 0;
  const rnd = mulberry32(31);
  for (const l of PAD_LAYOUT) {
    const x = l.u * W, y = l.v * H;
    const r = clamp(Math.min(W, H) * l.s, 30, 160);
    const pad = {
      x, y, r, lotus: !!l.lotus, seed: (rnd() * 1e6) | 0,
      notch: Math.atan2(H * 0.5 - y, W * 0.5 - x) + (rnd() - 0.5) * 1.4,
      ox: 0, oy: 0, vx: 0, vy: 0, rot: 0, vr: 0, bob: 0,
    };
    paintPad(pad);
    pads.push(pad);
    // 연잎 아래로는 물결이 조금 잦아듦
    const c = sim.cell;
    for (let yy = 0; yy < sim.rows; yy++) for (let xx = 0; xx < sim.cols; xx++) {
      const d = Math.hypot((xx - 1) * c - x, (yy - 1) * c - y);
      if (d < r * 0.92) sim.damp[yy * sim.cols + xx] *= 0.993;
    }
  }
}
function updatePads(dt) {
  for (const p of pads) {
    let gx = 0, gy = 0, tq = 0;
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * TAU;
      slopeAt(p.x + Math.cos(a) * p.r * 0.6, p.y + Math.sin(a) * p.r * 0.6, tmpS);
      gx += tmpS.x; gy += tmpS.y;
      tq += -Math.sin(a) * tmpS.x + Math.cos(a) * tmpS.y;
    }
    slopeAt(p.x, p.y, tmpS);
    flowAt(p.x, p.y, tmpF);
    const ax = -gx * 110 - p.ox * 3.2 - p.vx * 2.4 + (tmpF.x - (-(p.y - H * 0.52) * 0.011)) * 0.4;
    const ay = -gy * 110 - p.oy * 3.2 - p.vy * 2.4 + (tmpF.y - ((p.x - W * 0.5) * 0.011)) * 0.4;
    p.vx += ax * dt; p.vy += ay * dt;
    p.ox += p.vx * dt; p.oy += p.vy * dt;
    p.vr += (tq * 1.6 - p.rot * 2.2 - p.vr * 1.8) * dt;
    p.rot += p.vr * dt;
    p.bob += (tmpS.h - p.bob) * Math.min(1, dt * 6);
  }
}
function drawPads() {
  for (const p of pads) {
    const x = p.x + p.ox, y = p.y + p.oy;
    const s = 1 - clamp(p.bob, -1.5, 1.5) * 0.01;
    fx.fillStyle = 'rgba(4,10,12,0.3)';
    fx.beginPath(); fx.arc(x + 2.5, y + 4, p.r * s * 1.01, 0, TAU); fx.fill();
    fx.save();
    fx.translate(x, y); fx.rotate(p.rot); fx.scale(s / FXS, s / FXS);
    fx.drawImage(p.img, -p.size / 2, -p.size / 2);
    fx.restore();
  }
}
function drawPadShadows() {
  sc.fillStyle = 'rgba(0,0,0,0.5)';
  for (const p of pads) {
    sc.beginPath(); sc.arc(p.x + p.ox + 18, p.y + p.oy + 26, p.r * 1.02, 0, TAU); sc.fill();
  }
}
function avoidPads(o, pad) {
  for (const p of pads) {
    const dx = o.x - (p.x + p.ox), dy = o.y - (p.y + p.oy), d = Math.hypot(dx, dy) || 1, R = p.r * 0.97 + pad;
    if (d < R) { o.x += (dx / d) * (R - d); o.y += (dy / d) * (R - d); }
  }
}

/* ============================================================
   꽃잎 — 가끔 하늘에서 떨어져 물 위를 떠다님
   ============================================================ */
const petals = [];
let nextPetal = 4;
function spawnPetal() {
  if (petals.length >= 12) return;
  const rnd = Math.random;
  petals.push({
    x: W * (0.12 + rnd() * 0.76), y: H * (0.06 + rnd() * 0.8), z: 1,
    rot: rnd() * TAU, spin: (rnd() - 0.5) * 2.2, flip: rnd() * TAU, vr: (rnd() - 0.5) * 0.3,
    vx: 0, vy: 0, wind: (rnd() - 0.5) * 30, size: 6.5 + rnd() * 3.5,
    life: 70 + rnd() * 50, landed: false, deep: rnd() < 0.5,
  });
}
function updatePetals(dt) {
  if (now > nextPetal) { nextPetal = now + 7 + Math.random() * 10; spawnPetal(); }
  for (const p of petals) {
    if (!p.landed) {
      p.z -= dt / 3.4;
      p.x += (p.wind + Math.sin(now * 1.3 + p.flip) * 14) * dt * p.z;
      p.y += Math.cos(now * 0.9 + p.flip) * 6 * dt * p.z;
      p.rot += p.spin * dt; p.flip += dt * 2.4;
      if (p.z <= 0) {
        p.z = 0; p.landed = true;
        disturb(p.x, p.y, 6, 0.22);
        plip(0.22, 1.9);
      }
      continue;
    }
    flowAt(p.x, p.y, tmpF); slopeAt(p.x, p.y, tmpS);
    const k = 1 - Math.exp(-dt * 1.4);
    p.vx += (tmpF.x * 0.8 - tmpS.x * 70 - p.vx) * k;
    p.vy += (tmpF.y * 0.8 - tmpS.y * 70 - p.vy) * k;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt + (tmpF.x * tmpS.y - tmpF.y * tmpS.x) * dt * 0.4;
    p.vr *= 1 - dt * 0.05;
    avoidPads(p, p.size * 0.6);
    p.life -= dt;
  }
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i];
    if (p.life <= 0 || p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) petals.splice(i, 1);
  }
}
function drawPetals() {
  for (const p of petals) {
    const e = 1 - p.z * p.z;              // 착지할수록 선명하게
    const fade = Math.min(1, p.life / 6) * Math.min(1, e * 1.6 + 0.05);
    const s = p.size * (1 + p.z * 0.7);
    const sq = p.landed ? 1 : Math.max(0.25, Math.abs(Math.cos(p.flip)));
    const so = 2 + p.z * 46;
    fx.globalAlpha = fade * (0.6 - p.z * 0.4);
    fx.fillStyle = 'rgba(4,10,12,0.55)';
    fx.save(); fx.translate(p.x + so * 0.6, p.y + so); fx.rotate(p.rot); fx.scale(1, sq);
    petalShape(fx, s * 2, s * 1.15); fx.translate(-s, 0); fx.fill();
    fx.restore();
    fx.globalAlpha = fade;
    fx.save(); fx.translate(p.x, p.y); fx.rotate(p.rot); fx.scale(1, sq); fx.translate(-s, 0);
    const gr = fx.createLinearGradient(0, 0, s * 2, 0);
    gr.addColorStop(0, p.deep ? '#e2a6ae' : '#ecc2c6');
    gr.addColorStop(1, '#f7e7e3');
    fx.fillStyle = gr;
    petalShape(fx, s * 2, s * 1.15); fx.fill();
    fx.strokeStyle = 'rgba(190,120,130,0.22)'; fx.lineWidth = 0.6;
    fx.beginPath(); fx.moveTo(s * 0.3, 0); fx.lineTo(s * 1.6, 0); fx.stroke();
    fx.restore();
  }
  fx.globalAlpha = 1;
}

/* ============================================================
   소리 — Web Audio로 만든 물방울, 기본은 꺼짐
   ============================================================ */
const audio = { ctx: null, on: false, input: null, last: 0 };
function ensureAudio() {
  if (audio.ctx) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  const c = new AC();
  audio.ctx = c;
  const master = c.createGain(); master.gain.value = 0.9;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3800;
  const conv = c.createConvolver();
  const len = (c.sampleRate * 1.8) | 0, ir = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
  conv.buffer = ir;
  const wet = c.createGain(); wet.gain.value = 0.3;
  audio.input = c.createGain();
  audio.input.connect(lp); lp.connect(master); lp.connect(conv); conv.connect(wet); wet.connect(master);
  master.connect(c.destination);
  return true;
}
// 물방울: 사인파가 순간적으로 위로 미끄러지는 소리
function plip(vol, pitch) {
  if (!audio.on || !audio.ctx) return;
  const c = audio.ctx, t = c.currentTime + 0.005;
  if (t - audio.last < 0.045 && vol < 0.9) return;
  audio.last = t;
  const f0 = (380 + Math.random() * 360) * pitch;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f0 * 2.5, t + 0.085);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.05 * vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(audio.input);
  o.start(t); o.stop(t + 0.24);
}
let nextStirSound = 0;
listeners.tap.push(() => plip(1, 1));
listeners.stir.push((x, y, speed) => { if (now > nextStirSound && speed > 120) { nextStirSound = now + 0.16 + Math.random() * 0.2; plip(0.28, 1.15); } });
listeners.gulp.push(() => plip(0.45, 0.6));

const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', () => {
  if (!ensureAudio()) return;
  audio.on = !audio.on;
  if (audio.ctx.state !== 'running') audio.ctx.resume();
  soundBtn.setAttribute('aria-pressed', String(audio.on));
  soundBtn.setAttribute('aria-label', audio.on ? '소리 끄기' : '소리 켜기');
  if (audio.on) setTimeout(() => plip(0.8, 1.1), 60);
});

/* ============================================================
   크기 / 성능
   ============================================================ */
function sizeCanvases() {
  FS = Math.min(DPR, 1.5, RS);
  fishCanvas.width = Math.max(1, Math.round(W * FS));
  fishCanvas.height = Math.max(1, Math.round(H * FS));
  shadowCanvas.width = Math.max(1, Math.round(W * SS));
  shadowCanvas.height = Math.max(1, Math.round(H * SS));
  glCanvas.width = Math.max(1, Math.round(W * RS));
  glCanvas.height = Math.max(1, Math.round(H * RS));
  fxCanvas.width = Math.max(1, Math.round(W * FXS));
  fxCanvas.height = Math.max(1, Math.round(H * FXS));
}
function layout() {
  W = Math.max(1, stage.clientWidth || window.innerWidth);
  H = Math.max(1, stage.clientHeight || window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  RS = Math.min(DPR, 2) * qualityScale;
  FXS = Math.min(DPR, 2);
  sizeCanvases();
  initSim();
  initFlow();
  initMotes();
  if (!fish.length) initFish(); else clampFish();
  initPads();
  bottomCanvas = makeBottom();
  uploadBottom();
  allocWaveTex();
}
let qualityScale = 1;
let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layout, 160);
});

// 프레임이 버거우면 물 렌더 해상도를 조금씩 낮춤
const perf = { acc: 0, n: 0, slow: 0 };
function watchPerf(dt) {
  perf.acc += dt; perf.n++;
  if (perf.acc < 1.5) return;
  const avg = perf.acc / perf.n;
  perf.acc = 0; perf.n = 0;
  if (avg > 1 / 50) perf.slow++; else perf.slow = 0;
  if (perf.slow >= 2 && RS > 1.0) {
    perf.slow = 0;
    qualityScale = Math.max(1 / Math.min(DPR, 2), qualityScale - 0.15);
    RS = Math.min(DPR, 2) * qualityScale;
    sizeCanvases();
  }
}

/* ============================================================
   메인 루프
   ============================================================ */
const STEP = 1 / 60;
let acc = 0, lastT = performance.now(), nextAmbient = 3;

function ambient() {
  // 가끔 어디선가 아주 작은 물방울
  if (now > nextAmbient) {
    nextAmbient = now + 5 + Math.random() * 7;
    disturb(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.7), 6, 0.22);
  }
}

function frame(ts) {
  const dt = Math.min(0.1, (ts - lastT) / 1000);
  lastT = ts;
  now += dt;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 4) { simStep(); acc -= STEP; steps++; }
  if (steps === 4) acc = 0;
  ambient();
  updatePointers(dt);
  stepFlow(dt);
  updateMotes(dt);
  updateFish(dt);
  updatePads(dt);
  updatePetals(dt);
  updatePellets(dt);
  drawFish();
  if (glOK && !gl.isContextLost()) {
    if (steps) { encodeSim(); uploadWave(); }
    uploadLayers();
    renderGL();
  }
  drawSurface();
  watchPerf(dt);
  requestAnimationFrame(frame);
}

function start() {
  glOK = initGL();
  glCanvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); glOK = false; });
  glCanvas.addEventListener('webglcontextrestored', () => { glOK = initGL(); uploadBottom(); allocWaveTex(); });
  layout();
  if (!glOK) { // WebGL이 없으면 바닥만이라도
    glCanvas.style.display = 'none';
    fishCanvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
    stage.insertBefore(fishCanvas, fxCanvas);
    stage.style.background = `center / cover url(${bottomCanvas.toDataURL()})`;
  }
  setTimeout(() => { if (!touched) hint.classList.add('on'); }, 700);
  requestAnimationFrame((t) => { lastT = t; frame(t); });
}

// 다음 단계(물고기, 연잎, 소리)가 쓸 연결점
window.__pond = { pads, petals, spawnPetal, audio, disturb, flowAt, slopeAt, listeners, fish, pellets, shadowCanvas, sc, get size() { return { W, H }; } };

start();
})();
</script>
