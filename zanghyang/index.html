<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="잔향 殘響 — 관람객의 터치와 선이 작품이 되는 체험형 인터랙티브 전시" />
    <title>잔향 殘響</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230B0B0C'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23D9481C'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;400;600&display=swap" />
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>

    <!-- 0. 입구 -->
    <section id="entrance" aria-label="입구">
      <h1 class="entrance__title">
        <span class="entrance__ko" aria-label="잔향"><span>잔</span><span>향</span></span>
        <span class="entrance__han">殘 響</span>
      </h1>
      <p class="entrance__hint">화면을 만져보세요</p>
    </section>

    <!-- 전시실 이름 (입장 시 잠깐) -->
    <div id="room-label" aria-live="polite">
      <span class="room-label__num"></span>
      <span class="room-label__name"></span>
      <span class="room-label__line"></span>
    </div>

    <!-- 하단 UI -->
    <nav id="hud" aria-label="전시 안내">
      <span class="hud__index"><b class="hud__cur">01</b><i>/</i><span>04</span></span>
      <span class="hud__hint"></span>
      <span class="hud__right">
        <button class="hud__btn hud__sound" type="button" aria-pressed="true" aria-label="소리 켜기/끄기">
          <span class="hud__dot"></span><span class="hud__sound-label">소리</span>
        </button>
        <button class="hud__btn hud__next" type="button" aria-label="다음 전시실">
          <span class="hud__arrow"></span>
        </button>
      </span>
    </nav>

    <!-- 흐름: iOS 기울기 권한 -->
    <button id="tilt-permission" type="button">기울여 흐름을 바꾸려면 여기를 누르세요</button>

    <!-- 4. 잔상: 서명 -->
    <form id="signature" autocomplete="off" aria-label="서명">
      <label class="signature__label" for="signature-name">서명</label>
      <input id="signature-name" name="name" maxlength="12" placeholder="이름" enterkeyhint="done" />
      <div class="signature__actions">
        <button type="button" class="signature__btn signature__replay">다시 재생</button>
        <button type="submit" class="signature__btn signature__save">포스터 저장</button>
      </div>
    </form>

    <div id="toast" role="status"></div>
    <noscript>이 전시는 JavaScript와 WebGL이 필요합니다.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
